name: Temporary WordPress ZIP build

on:
  push:
    branches:
      - artifact/wordpress-zip-3.8.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build installable plugin ZIP
        run: |
          rm -rf /tmp/build
          mkdir -p /tmp/build/guida-antipanico-soffocamento
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/build/guida-antipanico-soffocamento/
          cd /tmp/build
          zip -r guia.tmp.zip guida-antipanico-soffocamento >/dev/null
          mv guia.tmp.zip guida-antipanico-soffocamento-v3.8.0.zip
          unzip -t guida-antipanico-soffocamento-v3.8.0.zip
          test -f guida-antipanico-soffocamento/guida-antipanico-soffocamento.php

      - name: Upload WordPress plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: guida-antipanico-soffocamento-v3.8.0
          path: /tmp/build/guida-antipanico-soffocamento-v3.8.0.zip
          retention-days: 1
          if-no-files-found: error
